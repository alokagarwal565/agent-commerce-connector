[project]
name = "agent-commerce-connector"
version = "0.1.0"
description = "Read-only WooCommerce connector exposing commerce data to AI agents via MCP tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20",
    "httpx>=0.27",
    "pydantic>=2.11",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
